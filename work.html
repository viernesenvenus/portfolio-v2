  <script>

      var t = localStorage.getItem('theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <nav class="navbar" aria-label="Navegación principal">
    <div class="container">
      <div class="navbar-inner">
        <a href="index.html" class="nav-logo">LC.</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="work.html" class="active">Work</a>
          <a href="playground.html">Playground</a>
          <a href="resume.html">Resume</a>
          <a href="contact.html">Contact</a>
        </div>
        <button class="theme-toggle" aria-label="Cambiar tema">☾</button>
        <button class="hamburger" aria-label="Abrir menú" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

  <div class="mobile-menu" aria-hidden="true">
    <a href="index.html">Home</a>

    <a href="work.html">Work</a>
    <a href="playground.html">Playground</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html">Contact</a>
  </div>

  <section class="page-section" style="padding-top: calc(var(--nav-height) + var(--spacing-4xl));">
    <div class="container">
      <h1 class="section-title fade-in">Work</h1>
      <p class="section-subtitle fade-in">Mi experiencia profesional.</p>
      <div class="timeline" id="work-timeline"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-text">&copy; 2026 Lucia Cruz</span>
        <div class="footer-links">

          <a href="contact.html">Contacto</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const res = await fetch('data/work.json');
      const work = await res.json();
      const timeline = document.getElementById('work-timeline');

      work.forEach(item => {
        const el = document.createElement('div');
        el.className = 'timeline-item fade-in';
        el.innerHTML = `
          <span class="timeline-date">${item.date}</span>
          <h3 class="timeline-title">${item.title}</h3>
          <span class="timeline-company">${item.company}</span>
          <p class="timeline-desc">${item.description}</p>
        `;
        timeline.appendChild(el);
      });

      initFadeIn();
    });
  </script>
</body>
</html>
